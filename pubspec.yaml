name: gitartha
description: "Gitartha (गीतार्थ) — a Bhagavad Gita reading and personal reflection app."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^17.5.0

  # Environment configuration
  flutter_dotenv: ^6.0.2

  # Local database (scripture cache) — schemas arrive in a later milestone.
  # drift_flutter bundles native SQLite (via sqlite3), so sqlite3_flutter_libs
  # is not needed as a direct dependency.
  drift: ^2.34.0
  drift_flutter: ^0.3.1

  # Backend: Supabase Auth (sign-in, session) and membership lookup.
  supabase_flutter: ^2.18.3

  # Persists the Supabase session (refresh token) in the iOS Keychain /
  # Android Keystore-backed storage instead of plain SharedPreferences.
  flutter_secure_storage: ^10.3.4

  # Classifies network failures (ClientException) during content sync.
  # Already a transitive dependency of supabase_flutter.
  http: ^1.6.0

  # Model serialization
  json_annotation: ^4.12.0

  # Content pipeline: JSON Schema (Draft 2020-12) validation of the
  # Bhagavad Gita content repository, and SHA-1 for deterministic (v5)
  # content UUIDs. crypto was already a transitive dependency.
  json_schema: ^5.2.2
  crypto: ^3.0.8

  # Lightweight preferences (e.g. theme mode)
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  json_serializable: ^6.14.1

  # Developer-side content publisher (tool/publish_gita_content.dart): the
  # pure-Dart Supabase client (supabase_flutter cannot run under `dart run`).
  # Its tests use http's MockClient from the `http` dependency above.
  supabase: ^2.16.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/branding/
    - assets/images/icons/
    - assets/images/illustrations/
    - assets/data/chapters/
    - assets/data/sample/
    # Bhagavad Gita content repository (source of truth for scripture).
    # Only runtime data is bundled: chapters, sources and the two JSON
    # Schemas. README.md and content-guidelines.md are not.
    - assets/data/bhagavad_gita/chapters/
    - assets/data/bhagavad_gita/sources/
    - assets/data/bhagavad_gita/schema/chapter.schema.json
    - assets/data/bhagavad_gita/schema/sources.schema.json

  # Bundled fonts (assets/fonts/devanagari, assets/fonts/english) will be
  # declared here once the font files are added.
